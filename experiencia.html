<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Experiência VR | Exposição Gradual</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%233ED0C0' d='M3.5 7h17a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5h-5.2q-3.3-3.2-6.6 0H3.5A1.5 1.5 0 0 1 2 15.5v-7A1.5 1.5 0 0 1 3.5 7z'/></svg>" />

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <link rel="stylesheet" href="experiencia.css" />
</head>
<body>

<!-- =============================================================
     CAMADA DE HTML

     Sobrou quase nada aqui, e de propósito. Toda a informação da
     experiência — nível, instrução, tempo, animais encontrados,
     desconforto relatado — vive dentro da cena 3D, como objeto.

     Dois motivos. Dentro do óculos esta camada simplesmente não
     existe: o WebXR mostra apenas o mundo 3D, e tudo o que
     estivesse aqui desapareceria. E, mesmo fora do óculos, os
     painéis tapavam o cenário.

     Ficou só o controle de andar, porque ele não é informação: é
     uma superfície de toque, e um dedo precisa de uma área de
     tela de verdade para arrastar. O outro elemento em HTML é o
     botão de entrar em Realidade Virtual, criado pelo próprio
     A-Frame.
     ============================================================= -->
<div id="hud">

  <!-- ---------- CONTROLE DE ANDAR (celular) ----------
       No computador há teclado; aqui não. Arrastar o dedo a
       partir do centro anda naquela direção. Escondido por
       padrão: só aparece em aparelhos com toque.
       ------------------------------------------------------ -->
  <div class="controle-andar" id="controleAndar" hidden>
    <span class="controle-andar__manete"></span>
    <span class="controle-andar__rotulo">andar</span>
  </div>

</div>

<!-- =============================================================
     CENA 3D
     ============================================================= -->
<a-scene id="cena"
         background="color: #0C1016"
         device-orientation-permission-ui="
           deviceMotionMessage: Esta experiencia precisa de acesso aos sensores de movimento do seu aparelho para acompanhar para onde voce olha.;
           httpsMessage: Abra esta pagina por HTTPS para entrar no modo de Realidade Virtual e permitir o acesso aos sensores.;
           allowButtonText: Permitir;
           denyButtonText: Agora nao;
           cancelButtonText: Fechar">

  <!-- ===========================================================
       CENÁRIO

       Fica vazio no HTML. Quem monta é cenarios.js, conforme o
       animal escolhido: a cobra aparece numa floresta, a barata
       numa cozinha, a aranha e o rato numa sala, o sapo num
       quintal.

       As luzes também vêm de lá, porque cada ambiente pede a sua:
       a luz de uma cozinha não é a de uma mata.
       =========================================================== -->
  <a-entity id="cenario"></a-entity>

  <!-- ===========================================================
       OS ANIMAIS

       Também vazio: experiencia.js cria um grupo com a quantidade
       que o nível pede, cada um com a mesma estrutura de camadas
       de antes:

       .animal        onde ele está no mundo
       .animalGiro    o movimento contínuo (girar devagar, respirar)
       .animalReacao  o sobressalto ao ser tocado (Nível 5)
       .animalModelo  recebe o arquivo 3D, já redimensionado
       .animalApoio   caixa provisória, do tamanho real do animal

       O som fica fora do grupo, num elemento só: quinze fontes de
       áudio iguais viraria ruído, além de pesar.
       =========================================================== -->
  <a-entity id="animais"></a-entity>

  <a-entity id="somAnimal"
            sound="loop: true;
                   autoplay: false;
                   positional: true;
                   refDistance: 1;
                   rolloffFactor: 1;
                   maxDistance: 25;
                   volume: 0.9"></a-entity>

  <!-- ===========================================================
       USUÁRIO: rig + câmera + mira
       =========================================================== -->
  <a-entity id="rig" position="0 0 0" andar-toque>

    <!-- ==========================================================
         SOM DO AMBIENTE

         Não tem posição: vem de todos os lados, como o rumor de
         um cômodo fechado. Fica preso ao rig, então acompanha
         quem usa.

         autoplay: false porque o navegador proíbe tocar áudio
         antes de a pessoa interagir com a página. Quem libera é
         o botão "Som".
         ========================================================== -->
    <a-entity id="somAmbiente"
              sound="src: url(assets/sounds/ambiente.wav);
                     loop: true;
                     autoplay: false;
                     positional: false;
                     volume: 0.35"></a-entity>

    <!-- ==========================================================
         CONSOLE DA EXPERIÊNCIA

         A interface vive DENTRO da cena 3D, e não numa camada
         de HTML por cima dela. Duas razões:

         1. Dentro do óculos a camada de HTML simplesmente não
            existe — o WebXR mostra apenas o mundo 3D. Quem
            entrava no óculos ficava sem nível, sem instrução e
            sem botão nenhum.

         2. Mesmo no computador, os painéis tapavam o cenário.

         O console é filho do rig, e não da câmera: ele acompanha
         a pessoa quando ela anda, mas NÃO gira junto com a
         cabeça. Interface colada no rosto causa enjoo em
         Realidade Virtual, e é por isso que nenhum óculos faz
         isso. Fica à esquerda, virado para quem usa, como um
         painel de instrumentos ao lado do corpo.
         ========================================================== -->
    <!-- A posição não foi escolhida no olho. Ela vem de três
         números: 32 graus à esquerda, 18 graus abaixo da linha
         dos olhos e 95 cm de distância — perto o bastante para
         ler, longe o bastante para não precisar focar, e dentro
         do giro de cabeça que uma pessoa faz sem incomodar.

         A rotação é a conta inversa: o painel gira os mesmos 32
         graus para encarar quem olha. Sem isso ele apareceria
         de esguelha e o texto ficaria ilegível. -->
    <a-entity id="consoleCena" position="-0.479 1.306 -0.766" rotation="-19 32 0">

      <a-entity id="painelConsole"
                position="0 0.06 0"
                console-cena="largura: 0.56; altura: 0.35"></a-entity>

      <!-- botões: cada um precisa ser um objeto separado, porque
           cada um recebe o próprio clique -->
      <a-entity id="btn3dProximo" class="botao3d interface"
                position="-0.145 -0.185 0"
                painel-texto="largura: 0.265; altura: 0.075; centralizar: true; texto: Próximo nível"></a-entity>

      <a-entity id="btn3dSom" class="botao3d interface"
                position="0.145 -0.185 0"
                painel-texto="largura: 0.265; altura: 0.075; centralizar: true; texto: Ativar som"></a-entity>

      <a-entity id="btn3dAjuda" class="botao3d interface"
                position="-0.145 -0.272 0"
                painel-texto="largura: 0.265; altura: 0.075; centralizar: true; texto: Ajuda"></a-entity>

      <a-entity id="btn3dAnsiedade" class="botao3d interface"
                position="0.145 -0.272 0"
                painel-texto="largura: 0.265; altura: 0.075; centralizar: true; texto: Como me sinto"></a-entity>

      <a-entity id="btn3dReiniciar" class="botao3d interface"
                position="-0.145 -0.359 0"
                painel-texto="largura: 0.265; altura: 0.075; centralizar: true; texto: Reiniciar"></a-entity>

      <a-entity id="btn3dSair" class="botao3d interface"
                position="0.145 -0.359 0"
                painel-texto="largura: 0.265; altura: 0.075; centralizar: true; texto: Sair"></a-entity>

    </a-entity>

    <!-- ==========================================================
         AVISO DE ABERTURA

         O console fica ao lado, fora do caminho do cenário — o
         que resolve a sobreposição, mas cria o risco de alguém
         entrar, olhar só para a frente e nunca perceber que há
         um painel à esquerda.

         Este aviso cobre esse buraco: aparece no centro, garante
         que a instrução seja lida, e some sozinho depois de
         alguns segundos, devolvendo a cena inteira.
         ========================================================== -->
    <a-entity id="avisoAbertura"
              position="0 1.45 -1.15"
              aviso-abertura
              painel-texto="largura: 0.90; altura: 0.34"></a-entity>

    <!-- ==========================================================
         AJUDA

         Aparece à frente quando pedida, e some ao ser tocada de
         novo. Fica no centro, e não ao lado: é texto para ler,
         não para consultar de canto de olho — e quem pediu ajuda
         parou de explorar o cenário de qualquer forma.
         ========================================================== -->
    <a-entity id="painelAjuda" visible="false"
              position="0 1.42 -1.10"
              class="interface"
              painel-texto="largura: 0.92; altura: 0.42"></a-entity>

    <!-- ==========================================================
         ESCALA DE DESCONFORTO (autorrelato de 0 a 10)

         Nenhum sensor mede desconforto: quem informa é a própria
         pessoa. Os onze botões são criados por experiencia.js, em
         duas fileiras — onze numa fileira só dariam 1,05 m de
         largura, o que não cabe na tela estreita de um celular.
         ========================================================== -->
    <a-entity id="escalaAnsiedade" visible="false"
              position="0 1.34 -1.10">

      <a-entity id="tituloEscala" class="interface"
                position="0 0.14 0"
                painel-texto="largura: 0.72; altura: 0.11; centralizar: true;
                              texto: Quanto desconforto você sente agora?"></a-entity>

      <a-entity id="botoesEscala"></a-entity>

    </a-entity>

    <!-- ==========================================================
         CONTROLES DE MÃO

         laser-controls faz parte do A-Frame: reconhece sozinho o
         controle do Quest, do Vive, do Windows MR e desenha um
         raio de mira. Sem óculos, estas entidades ficam inertes.
         ========================================================== -->
    <a-entity id="maoEsquerda"
              laser-controls="hand: left"
              raycaster="objects: .clicavel, .alvo; far: 10"></a-entity>

    <a-entity id="maoDireita"
              laser-controls="hand: right"
              raycaster="objects: .clicavel, .alvo; far: 10"></a-entity>

    <!-- ==========================================================
         PONTEIRO DA INTERFACE

         Dois apontadores, e não um, porque são duas coisas
         diferentes de apontar.

         A MIRA (dentro da câmera) enxerga apenas .clicavel: os
         animais e as portas de armário. No celular ela seleciona
         pelo olhar demorado, que é a única forma de interagir
         quando não há onde clicar.

         O PONTEIRO enxerga apenas .interface: o console, os
         botões, a ajuda e a escala. Ele parte do dedo ou do
         mouse, nunca do centro da tela, e só dispara com um
         toque de verdade.

         A classe .interface marca o que é interface e nunca muda.
         Quem o apontador enxerga é .alvo, que entra e sai conforme
         o painel esteja aberto ou fechado — porque o A-Frame NÃO
         ignora objeto invisível no cálculo do raio, e um painel
         escondido na frente dos botões engolia o clique deles.

         A separação corrige um defeito grave. No celular o
         console fica centralizado, e a mira repousava em cima
         dele: depois de 1,2 segundo a seleção por olhar disparava
         sozinha o botão que estivesse no centro. Se calhasse de
         ser "Reiniciar", a página recarregava — e recarregava de
         novo, em laço, porque a mira voltava para o mesmo lugar.
         ========================================================== -->
    <a-entity id="ponteiro"
              cursor="rayOrigin: mouse; fuse: false"
              raycaster="objects: .alvo; far: 10"></a-entity>

    <a-camera
      id="camera"
      position="0 1.6 0"
      wasd-controls="acceleration: 10; fly: false"
      look-controls="pointerLockEnabled: false">
      <a-cursor
        id="mira"
        color="#3ED0C0"
        fuse="false"
        fuse-timeout="1200"
        raycaster="objects: .clicavel; far: 30">
      </a-cursor>
    </a-camera>
  </a-entity>

</a-scene>

<script src="dados.js"></script>
<script src="animador.js"></script>
<script src="painel.js"></script>
<script src="console.js"></script>
<script src="cenarios.js"></script>
<script src="descoberta.js"></script>
<script src="controles.js"></script>
<script src="experiencia.js"></script>
</body>
</html>
