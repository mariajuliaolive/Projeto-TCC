<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protótipo VR - Exposição Gradual (TCC)</title>

  <!-- Favicon desenhado em SVG, embutido na propria pagina -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%233ED0C0' d='M3.5 7h17a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5h-5.2q-3.3-3.2-6.6 0H3.5A1.5 1.5 0 0 1 2 15.5v-7A1.5 1.5 0 0 1 3.5 7z'/></svg>" />

  <!-- Biblioteca A-Frame (carregada pela internet, via CDN) -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <!-- Nosso arquivo de estilos -->
  <link rel="stylesheet" href="experiencia.css" />
</head>
<body>

  <!-- Camada de interface em HTML, que fica POR CIMA da cena 3D -->
  <div id="interface">
    <a href="index.html" id="voltar">&larr; Voltar ao início</a>
    <p id="aviso">
      Protótipo acadêmico de Realidade Virtual (TCC).
      Não constitui tratamento médico ou psicológico.
    </p>
  </div>

  <!-- A cena 3D começa aqui -->
  <a-scene id="cena">

    <!-- Chão -->
    <a-plane
      position="0 0 0"
      rotation="-90 0 0"
      width="20"
      height="20"
      color="#7BC8A4">
    </a-plane>

    <!-- Objeto de teste: um cubo à nossa frente -->
    <a-box
      position="0 1 -4"
      width="1"
      height="1"
      depth="1"
      color="#4C6EF5">
    </a-box>

    <!-- Céu: uma esfera gigante que envolve toda a cena -->
    <a-sky color="#ECECEC"></a-sky>

  </a-scene>

  <!-- Nosso arquivo de JavaScript, carregado no final -->
  <script src="experiencia.js"></script>

</body>
</html>
