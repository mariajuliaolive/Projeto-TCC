<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protótipo VR - Exposição Gradual (TCC)</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%233ED0C0' d='M3.5 7h17a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5h-5.2q-3.3-3.2-6.6 0H3.5A1.5 1.5 0 0 1 2 15.5v-7A1.5 1.5 0 0 1 3.5 7z'/></svg>" />

  <!-- Biblioteca A-Frame (carregada pela internet, via CDN) -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <link rel="stylesheet" href="experiencia.css" />
</head>
<body>

  <!-- Camada de interface em HTML, que fica POR CIMA da cena 3D -->
  <div id="interface">
    <a href="selecao.html" id="voltar">&larr; Trocar experiência</a>
    <p id="selecaoInfo">Carregando...</p>
    <p id="ajuda"></p>
  </div>

  <a-scene id="cena">

    <!-- ============================================================
         CHÃO
         ============================================================ -->
    <a-plane
      position="0 0 0"
      rotation="-90 0 0"
      width="60"
      height="60"
      color="#3E6B57">
    </a-plane>

    <!-- ============================================================
         MARCOS DE REFERÊNCIA
         Sem pontos fixos na cena é impossível perceber que você
         está andando. São temporários: viram cenário na Etapa 3.
         ============================================================ -->
    <a-cylinder position="-6  1.5 -8"  radius="0.3" height="3" color="#5C7A8A"></a-cylinder>
    <a-cylinder position=" 6  1.5 -8"  radius="0.3" height="3" color="#5C7A8A"></a-cylinder>
    <a-cylinder position="-6  1.5 -18" radius="0.3" height="3" color="#5C7A8A"></a-cylinder>
    <a-cylinder position=" 6  1.5 -18" radius="0.3" height="3" color="#5C7A8A"></a-cylinder>

    <!-- ============================================================
         O ANIMAL

         Três camadas, cada uma com uma responsabilidade:

         #animal        onde ele está no mundo (a distância do nível)
         #animalModelo  recebe o arquivo 3D, já redimensionado
         #animalApoio   caixa provisória, do tamanho real do animal,
                        usada enquanto não houver arquivo 3D

         A classe "clicavel" autoriza a mira a enxergar o conjunto.
         ============================================================ -->
    <a-entity id="animal" class="clicavel" position="0 0 -4">

      <a-entity id="animalModelo"></a-entity>

      <a-box
        id="animalApoio"
        color="#4C6EF5"
        opacity="0.85">
      </a-box>

    </a-entity>

    <!-- ============================================================
         ILUMINAÇÃO
         Declarada explicitamente: assim que criamos uma luz, o
         A-Frame para de usar as luzes automáticas dele.
         ============================================================ -->
    <a-light type="ambient"     color="#BBC7D9" intensity="0.6"></a-light>
    <a-light type="directional" color="#FFFFFF" intensity="0.8" position="-3 5 2"></a-light>

    <!-- Céu -->
    <a-sky color="#9FB6C9"></a-sky>

    <!-- ============================================================
         USUÁRIO: rig + câmera + mira
         O rig representa "onde a pessoa está no mundo".
         A câmera representa "para onde a cabeça dela aponta".
         ============================================================ -->
    <a-entity id="rig" position="0 0 0">

      <a-camera
        id="camera"
        position="0 1.6 0"
        wasd-controls="acceleration: 10; fly: false"
        look-controls="pointerLockEnabled: false">

        <!-- Mira presa à câmera: aponta sempre para onde se olha -->
        <a-cursor
          id="mira"
          color="#3ED0C0"
          fuse="false"
          fuse-timeout="1200"
          raycaster="objects: .clicavel; far: 30">
        </a-cursor>

      </a-camera>

    </a-entity>

  </a-scene>

  <script src="dados.js"></script>
  <script src="experiencia.js"></script>
</body>
</html>
